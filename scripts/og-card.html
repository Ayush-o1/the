<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Share card</title>
    <!-- The social card (1200x630), drawn from the hero's own type and colours. Rendered to
         public/og.jpg by scripts/og-image.js. Not part of the site build. -->
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-weight: 300 400;
        src: url('../src/fonts/fraunces-roman.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Hanken Grotesk';
        font-weight: 400 600;
        src: url('../src/fonts/hanken-grotesk.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-weight: 400 500;
        src: url('../src/fonts/geist-mono.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0a0d12;
        overflow: hidden;
      }
      .card {
        position: relative;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: 1200px;
        height: 630px;
        padding: 64px 80px 60px;
        color: #cfcabd;
        font-family: 'Hanken Grotesk', sans-serif;
      }
      /* Faint stars on the right only, away from the words. */
      .card::before {
        content: '';
        position: absolute;
        inset: 0 0 0 46%;
        background-image:
          radial-gradient(1px 1px at 40px 60px, rgba(236, 230, 216, 0.5), transparent),
          radial-gradient(1px 1px at 190px 150px, rgba(236, 230, 216, 0.35), transparent),
          radial-gradient(1.5px 1.5px at 320px 40px, rgba(134, 182, 200, 0.45), transparent),
          radial-gradient(1px 1px at 120px 250px, rgba(236, 230, 216, 0.3), transparent),
          radial-gradient(1px 1px at 280px 290px, rgba(236, 230, 216, 0.4), transparent);
        background-size:
          360px 320px,
          420px 300px,
          480px 340px,
          300px 360px,
          440px 280px;
        mask-image: linear-gradient(90deg, transparent, #000 40%);
      }
      .top {
        display: flex;
        justify-content: space-between;
        font-size: 26px;
      }
      .name {
        color: #ece6d8;
        font-weight: 500;
      }
      .role {
        color: #a39f94;
      }
      h1 {
        margin: auto 0 0;
        max-width: 6em;
        color: #ece6d8;
        font-family: 'Fraunces', serif;
        font-size: 124px;
        font-weight: 300;
        line-height: 1;
        letter-spacing: -0.028em;
        margin-left: -5px;
      }
      .proof {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 52px;
        padding-top: 22px;
        border-top: 1px solid rgba(236, 230, 216, 0.22);
        font-size: 22px;
      }
      .proof q {
        color: #ece6d8;
        font-family: 'Geist Mono', monospace;
        font-size: 22px;
        quotes: none;
      }
      .proof span {
        color: #a39f94;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <span class="name">Ayush Kumar</span><span class="role">Software engineer, Bengaluru</span>
      </div>
      <h1>I write the code that says no.</h1>
      <p class="proof"><q>Incident is closed and cannot be modified.</q><span>BlackWater</span></p>
    </div>
  </body>
</html>
